  }
  function withTimeout(p, ms) { return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error("timeout")); }, ms); })]); }
  var LABEL = { follow: { asis: "Yes, as it is", minor: "Yes, with small doubts", check: "I would double check", no: "No" }, style: { plan: "A finished plan", own: "Build my own", mix: "A mix" }, pay: { no: "No", maybe: "Maybe, for certain features", yes: "Yes" } };
  function lab(k, v) { var m = LABEL[k]; return v != null && m && m[v] ? m[v] : v; }
  var STATUS = { done: "Did it", trouble: "Did it, but it was hard", failed: "Could not do it", skipped: "Skipped" };
  function flat(p) {
    var a = p.answers, o = {}, g = function (k) { var v = getP(a, k); return v == null || v === "" ? "(no answer)" : String(v); }, n = 0;
    function put(label, v) { n++; o[(n < 10 ? "0" : "") + n + " " + label] = v; }
    put("Age group", g("about.age")); put("Trips in last 2 years", g("about.trips")); put("How they plan trips", g("about.habit"));
    TASKS.forEach(function (t, i) {
      var st = getP(a, "tasks." + t.id + ".status"), e = getP(a, "tasks." + t.id + ".ease");
      put("Task " + (i + 1) + " " + t.title + ": result", st ? STATUS[st] || st : "(no answer)");
      put("Task " + (i + 1) + " " + t.title + ": ease (1-5)", e ? e + " out of 5" : "NOT RATED");
      put("Task " + (i + 1) + " " + t.title + ": where they got stuck", g("tasks." + t.id + ".note"));
    });
    put("Helped on last trip (1-5)", g("r.help")); put("Would follow the route", lab("follow", g("r.follow"))); put("What would stop them trusting it", g("r.trust"));
    put("Finished plan or build own", lab("style", g("r.style"))); put("Recommend to a friend (0-10)", g("r.nps")); put("Would pay", lab("pay", g("r.pay"))); put("What they would pay for", g("r.payNote"));
    put("Confusing or annoying", g("t.confusing")); put("Missing", g("t.missing")); put("Liked best", g("t.liked")); put("Contact", g("about.contact"));
    (a.routeFeedback || []).forEach(function (e, i) { put("Route feedback " + (i + 1), (e.title || "") + " (" + (e.city || "") + "), " + (e.rating || "-") + "/5; issues: " + ((e.issues || []).join(", ") || "-") + "; " + (e.comment || "-") + "; adjustments: " + ((e.adjustments || []).join(" / ") || "-")); });
    return o;
  }
  async function deliver(p) {
    if (CFG.feedbackUrl) { // a form service that accepts a JSON POST (Formspree)
      var f = await withTimeout(fetch(CFG.feedbackUrl, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(Object.assign({ _subject: "PASO feedback " + p.id.slice(0, 8) }, flat(p), { id: p.id, message: asText(p) })) }), 12000);
      if (!f.ok) throw new Error("HTTP " + f.status); return "form";
    }
    if (CFG.feedbackApi != null) { // own server
      var r = await withTimeout(fetch(String(CFG.feedbackApi).replace(/\/$/, "") + "/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(p) }), 10000);
      if (!r.ok) throw new Error("HTTP " + r.status); return "server";
    }
    if (window.claude && window.claude.use) {
      var db = await withTimeout(window.claude.use("db"), 10000), user = await withTimeout(window.claude.use("user"), 10000);
      var uid = db && user && typeof user.id === "function" ? await withTimeout(user.id(), 10000) : null; // one stored response per signed-in viewer; sending again replaces it
      if (db && uid) { await withTimeout(db.collection("responses").doc(uid).set(p), 10000); return "db"; }
    }
    throw new Error("no automatic route");
  }
  function fallbackHtml(p) {
    var txt = asText(p), mail = REPLY_TO ? '<a class="go" style="display:block;text-align:center;text-decoration:none;line-height:48px" id="pfb-mail" href="mailto:' + esc(REPLY_TO) + "?subject=" + encodeURIComponent("PASO feedback") + "&body=" + encodeURIComponent(txt.slice(0, 1800)) + '">Email my answers</a>' : "";
    return '<p class="bad">I could not send this automatically.</p><p>Please send your answers back to ' + (REPLY_TO ? "<strong>" + esc(REPLY_TO) + "</strong>" : "whoever shared this with you") + ". Pick whichever is easiest:</p>" + mail +
      '<button class="go alt" id="pfb-copy">Copy my answers</button><button class="go alt" id="pfb-dl">Download my answers</button><textarea readonly id="pfb-text" style="margin-top:8px;min-height:160px" aria-label="Your answers">' + esc(txt) + "</textarea>";
  }
  var sending = false;
  root.querySelector("#pfb-send").onclick = async function () {
    if (sending) return; var msg = root.querySelector("#pfb-msg");
    var miss = TASKS.filter(function (t, i) { return getP(S.v, "tasks." + t.id + ".status") && !getP(S.v, "tasks." + t.id + ".ease"); });
    if (miss.length && !S.nudged) { S.nudged = true; save(); msg.innerHTML = '<span class="bad">One more thing: you did not say how easy ' + (miss.length > 1 ? "these tasks were" : "this task was") + ": " + miss.map(function (t) { return esc(t.title); }).join(", ") + '. Tap a number from 1 to 5 under "How easy was it?", then tap Send again. Or tap Send again now to send without it.</span>'; try { root.querySelector("#pfb-s-" + miss[0].id).scrollIntoView({ block: "start" }); } catch (e) {} return; }
    if (progress() === 0 && !(S.v.routeFeedback || []).length) { msg.innerHTML = '<span class="bad">Answer at least one question first.</span>'; return; }
    sending = true; this.disabled = true; msg.textContent = "Sending...";
    var p = payload(), how = null;
    try { how = await deliver(p); } catch (e) { how = null; }
    sending = false; this.disabled = false;
    if (how) { S.sentAt = Date.now(); save(); root.querySelector("#pfb-body").innerHTML = '<div class="sec"><h3 class="ok">Sent. Thank you!</h3><p class="hint">Your answers are in. You can keep exploring the app, or close this panel.</p><button class="go alt" id="pfb-again">Send another response</button></div>';
      root.querySelector("#pfb-again").onclick = function () { S = { id: uid(), startedAt: Date.now(), v: {} }; save(); location.reload(); }; }
    else {
      msg.innerHTML = fallbackHtml(p);
      var c = root.querySelector("#pfb-copy"), dl = root.querySelector("#pfb-dl");
      c.onclick = function () { var t = root.querySelector("#pfb-text"); t.select(); var done = function () { c.textContent = "Copied"; }; try { navigator.clipboard.writeText(t.value).then(done, function () { c.textContent = "Select the text below and copy it"; }); } catch (e) { c.textContent = "Select the text below and copy it"; } };
      dl.onclick = function () { try { var u = URL.createObjectURL(new Blob([root.querySelector("#pfb-text").value], { type: "text/plain" })), a = document.createElement("a"); a.href = u; a.download = "paso-feedback-" + p.id.slice(0, 8) + ".txt"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 2000); dl.textContent = "Downloaded"; } catch (e) { dl.textContent = "Select the text below and copy it"; } };
    }
  };
  if (!S.sentAt && (!Object.keys(S.v).length || window.innerWidth >= 900)) setOpen(true); else setOpen(false, true);
  applyDock();

  // ---- Owner results view: open the page with #results ----
  async function results() {
    var el = document.createElement("div"); el.style.cssText = "position:fixed;inset:0;z-index:2147483002;background:#F1F2EF;overflow:auto;padding:16px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#0F1B2D";
    el.innerHTML = "<h2>PASO test results</h2><p id='rs-s'>Loading...</p>"; document.body.appendChild(el);
    var s = el.querySelector("#rs-s"), db = null;
    try { db = window.claude && window.claude.use ? await withTimeout(window.claude.use("db"), 10000) : null; } catch (e) {}
    if (!db) { s.textContent = "Results can only be read by the owner while signed in. If testers sent answers by copy, paste them into a doc."; return; }
    var snap; try { snap = await withTimeout(db.collection("responses").get(), 10000); } catch (e) { s.textContent = "Could not load responses."; return; }
    var rows = snap.docs.map(function (d) { return d.data(); });
    if (!rows.length) { s.textContent = "No responses yet."; return; }
    var num = function (r, k) { var v = getP(r.answers || {}, k); return v == null || v === "" ? NaN : Number(v); };
    var mean = function (k) { var a = rows.map(function (r) { return num(r, k); }).filter(isFinite); return a.length ? (a.reduce(function (x, y) { return x + y; }, 0) / a.length).toFixed(1) + " (n=" + a.length + ")" : "-"; };
    var cnt = function (k) { var m = {}; rows.forEach(function (r) { var v = getP(r.answers || {}, k); if (v) m[v] = (m[v] || 0) + 1; }); return Object.keys(m).map(function (x) { return x + ": " + m[x]; }).join(", ") || "-"; };
    var h = "<p>" + rows.length + " responses</p><table><tr><th>Measure</th><th>Result</th></tr>";
    TASKS.forEach(function (t, i) { h += "<tr><td>Task " + (i + 1) + " " + esc(t.title) + "</td><td>ease " + mean("tasks." + t.id + ".ease") + "; " + esc(cnt("tasks." + t.id + ".status")) + "</td></tr>"; });
    h += "<tr><td>Helped (1-5)</td><td>" + mean("r.help") + "</td></tr><tr><td>Would follow route</td><td>" + esc(cnt("r.follow")) + "</td></tr><tr><td>Plan or build</td><td>" + esc(cnt("r.style")) + "</td></tr><tr><td>Recommend (0-10)</td><td>" + mean("r.nps") + "</td></tr><tr><td>Would pay</td><td>" + esc(cnt("r.pay")) + "</td></tr><tr><td>Age groups</td><td>" + esc(cnt("about.age")) + "</td></tr></table><h3>Comments</h3>";
    rows.forEach(function (r) { var a = r.answers || {}; h += "<div class='card' style='background:#fff;border:1px solid #D9DDD6;border-radius:8px;padding:10px;margin:8px 0'><b>" + esc(getP(a, "about.age") || "?") + "</b><br>" + ["t.confusing", "t.missing", "t.liked", "r.trust", "r.payNote"].map(function (k) { var v = getP(a, k); return v ? esc(k.split(".")[1]) + ": " + esc(v) : ""; }).filter(Boolean).join("<br>") + "</div>"; });
    s.remove(); el.insertAdjacentHTML("beforeend", h);
    var b = document.createElement("button"); b.textContent = "Close"; b.style.cssText = "position:fixed;top:10px;right:10px;padding:10px 14px;font-weight:700"; b.onclick = function () { el.remove(); }; el.appendChild(b);
  }
  if (location.hash === "#results") results();
  window.addEventListener("hashchange", function () { if (location.hash === "#results") results(); });
})();
</script></body></html>
